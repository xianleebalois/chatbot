<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashra's Assistant</title>
    
    <!-- Google Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font (Fallback/UI) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        google: ['"Google Sans"', 'sans-serif'], 
                    },
                    colors: {
                        pastelGreen: '#d1fae5', 
                        pastelPink: '#fce7f3',  
                        brandGreen: '#10b981',  
                        brandPink: '#ec4899',   
                    }
                }
            }
        }
    </script>
    
    <style>
        /* --- BLOBBY / FLOWY BUBBLE CSS (PINKISH WITH A HINT OF GREEN) --- */
        .blob-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blob {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Balanced pink and green gradient */
            background: linear-gradient(135deg, #fbcfe8, #d1fae5, #fce7f3);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: blob-morph 8s ease-in-out infinite alternate;
            /* Glow that hints at both colors */
            box-shadow: 0 0 35px rgba(251, 207, 232, 0.8), 0 0 50px rgba(209, 250, 229, 0.7);
            overflow: hidden;
            z-index: 1;
        }

        .blob::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            /* Internal flow with more green presence */
            background: radial-gradient(circle at 30% 30%, rgba(251, 207, 232, 0.9), transparent 60%),
                        radial-gradient(circle at 70% 70%, rgba(209, 250, 229, 0.9), transparent 60%);
            filter: blur(20px);
            animation: blob-spin 12s linear infinite;
        }

        .blob img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        @keyframes blob-morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
            100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        }

        @keyframes blob-spin {
            100% { transform: rotate(360deg); }
        }

        /* --- CHAT UI CSS --- */
        .chat-message {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- TYPEWRITER CURSOR --- */
        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #6b7280; 
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Nav -->
    <header class="flex justify-between items-center p-4 text-gray-500">
        <div class="flex items-center gap-2">
            <button class="p-2 hover:bg-gray-200 rounded-lg transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M9 3v18"/></svg>
            </button>
        </div>
        <div class="flex items-center gap-4">
          
            <button class="p-2 hover:bg-gray-200 rounded-lg transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button class="flex items-center gap-2 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-sm font-medium transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Export chat
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar flex flex-col items-center justify-center p-4">
        
        <!-- Initial Greeting State -->
        <div id="greeting-state" class="flex flex-col items-center w-full max-w-3xl transition-opacity duration-500">
            
            <!-- FLOWY BLOB ICON CONTAINER -->
            <div class="blob-wrapper mb-8">
                <div class="blob">
                    <!-- REPLACE THIS WITH YOUR <img src="your-image.png" alt="Ashra"> -->
                </div>
            </div>

            <h1 class="font-google text-3xl md:text-4xl font-medium mb-2 text-transparent bg-clip-text bg-gradient-to-r from-brandGreen to-brandPink">
                Hello, I'm Ashra's Assistant
            </h1>
            
            <!-- TYPEWRITER EFFECT APPLIED HERE (LIGHTER TEXT COLOR) -->
            <h2 class="font-google text-3xl md:text-4xl font-medium text-gray-500 mb-10 text-center flex items-center justify-center h-12">
                <span id="typewriter-text"></span><span class="typewriter-cursor"></span>
            </h2>
        </div>

        <!-- Chat History Container -->
        <div id="chat-history" class="hidden w-full max-w-3xl flex-col gap-6 pb-4">
            <!-- Messages injected here -->
        </div>

    </main>

    <!-- Bottom Input Section -->
    <div class="w-full max-w-3xl mx-auto p-4 pt-0 pb-8">
        
        <!-- Input Box -->
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-pastelPink focus-within:border-transparent transition-all duration-300">
            
            <textarea id="user-input" rows="1" 
                class="w-full bg-transparent border-none outline-none resize-none px-4 pt-4 pb-2 text-gray-700 placeholder-gray-400 text-lg" 
                placeholder="Ask me anything about Ashra..."></textarea>

            <!-- Toolbar -->
            <div class="flex justify-end items-center px-3 pb-3">
                <!-- Send Button: Bright Arrow with Drop Shadow -->
                <button id="send-btn" class="p-2 bg-gradient-to-r from-pastelPink via-pastelGreen to-pastelPink text-white rounded-full hover:opacity-80 transition shadow-sm drop-shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                </button>
            </div>
        </div>
    </div>

        <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- TYPEWRITER EFFECT LOGIC ---
            const typewriterElement = document.getElementById('typewriter-text');
            const textToType = "Ask anything about Ashra!";
            let typeIndex = 0;
            let isDeleting = false;
            let typeSpeed = 100; 
            let deleteSpeed = 50; 

            function typeWriter() {
                const currentText = textToType.substring(0, typeIndex);
                typewriterElement.textContent = currentText;

                if (!isDeleting) {
                    typeIndex++;
                    typeSpeed = 100;
                    if (typeIndex > textToType.length) {
                        isDeleting = true;
                        typeSpeed = 2000; 
                    }
                } else {
                    typeIndex--;
                    typeSpeed = deleteSpeed;
                    if (typeIndex === 0) {
                        isDeleting = false;
                        typeSpeed = 500; 
                    }
                }
                setTimeout(typeWriter, typeSpeed);
            }
            typeWriter();


            // --- CHAT LOGIC ---
            const greetingState = document.getElementById('greeting-state');
            const chatHistory = document.getElementById('chat-history');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            let isChatActive = false;

            // Keep a history of messages to send to the AI
            let messageHistory = [];

            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.value === '') this.style.height = 'auto';
            });

            // NEW: Real Fetch Request to Cloudflare Worker
            async function sendMessage(text) {
                const message = text || userInput.value.trim();
                if (!message) return;

                if (!isChatActive) {
                    greetingState.style.opacity = '0';
                    setTimeout(() => {
                        greetingState.classList.add('hidden');
                        chatHistory.classList.remove('hidden');
                        chatHistory.classList.add('flex');
                    }, 300);
                    isChatActive = true;
                }

                // Add user message to UI and history
                addMessageToChat('user', message);
                messageHistory.push({ role: 'user', content: message });
                
                userInput.value = '';
                userInput.style.height = 'auto';

                // Show a temporary "Thinking..." message
                const thinkingId = 'thinking-' + Date.now();
                addMessageToChat('assistant', "Thinking...", thinkingId);

                try {
                    // Replace this URL with your actual Worker URL!
                    const WORKER_URL = 'https://ashra-chat-assistant.xianleebaloisbaloiz.workers.dev/api/chat'; 
                    
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            messages: messageHistory 
                        })
                    });

                    if (!response.ok) throw new Error("Network response was not ok");

                    const data = await response.json();
                    
                    // Remove the "Thinking..." message
                    document.getElementById(thinkingId)?.remove();

                    // Add the real AI response
                    addMessageToChat('assistant', data.response);
                    messageHistory.push({ role: 'assistant', content: data.response });

                } catch (error) {
                    console.error("Error:", error);
                    document.getElementById(thinkingId)?.remove();
                    addMessageToChat('assistant', "Sorry, I'm having trouble connecting to Ashra's brain right now.");
                }
            }

            function addMessageToChat(role, text, id = null) {
                const msgDiv = document.createElement('div');
                if (id) msgDiv.id = id;
                
                msgDiv.className = `chat-message flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;

                const bubble = document.createElement('div');
                
                if (role === 'user') {
                    bubble.className = 'bg-gradient-to-r from-pastelPink via-pastelGreen to-pastelPink text-gray-800 px-5 py-3 rounded-2xl rounded-tr-sm max-w-[80%] shadow-sm font-google';
                } else {
                    bubble.className = 'bg-white border border-gray-100 text-gray-700 px-5 py-3 rounded-2xl rounded-tl-sm max-w-[80%] shadow-sm font-google';
                }

                bubble.textContent = text;
                msgDiv.appendChild(bubble);
                chatHistory.appendChild(msgDiv);

                chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }

            sendBtn.addEventListener('click', () => sendMessage());
            
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
